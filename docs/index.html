<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kuwaGO</title>
  <meta name="description" content="kuwaGO: a cozy pixel-art study garden. Study to grow your plants.">
  <style>
    :root { --bg: #f3e8d2; --paper: #fbf3e4; --ink: #3e2a1b; --muted: #7a5e47; --green: #4e7a2c; --line: #e2c69c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1f1711; --paper: #2b2018; --ink: #f3e8d2; --muted: #c9b08f; --green: #9ccc6b; --line: #4a3626; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 48px 16px; text-align: center; }
    article { background: var(--paper); border: 2px solid var(--line); border-radius: 6px; padding: 28px 20px; }
    img { width: 96px; height: 96px; image-rendering: pixelated; }
    h1 { margin: 8px 0 4px; } p { color: var(--muted); } a { color: var(--green); font-weight: 600; }
    ul { list-style: none; padding: 0; } li { margin: 8px 0; }
  </style>
</head>
<body>
<main>
  <article>
    <img src="icon.png" alt="kuwaGO icon">
    <h1>kuwaGO</h1>
    <p>A cozy pixel-art study garden. Finish focus sessions to grow your plants, and turn your notes into quizzes, flashcards and summaries.</p>
    <ul>
      <li><a href="privacy.html">Privacy policy</a></li>
      <li><a href="delete-account.html">Delete your account</a></li>
      <li><a href="https://github.com/neckolescano/kuwaGO">About the project</a></li>
    </ul>
  </article>
</main>
</body>
</html>
